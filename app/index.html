<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skipper</title>

    <style>
      /* for testing visual purposes */
      body {
        margin: 0;
        padding: 0;
        position: relative;
        min-height: 100vh;
      }

      #sidebar {
        position: absolute;
        top: 5px;
        left: 5px;
      }

      #sidebar a {
        transition: opacity 0.2s ease;
      }

      #sidebar a:hover {
        opacity: 0.6;
      }

      #sidebar img {
        width: 50px;
        height: auto;
        cursor: pointer;
      }

      #main-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 100vh;
      }

      #main-body img {
        width: 75%;
        max-width: 500px;
      }

      #main-body button {
        /* structure */
        background-color: black;
        color: white;
        padding: 10px 24px;
        border: none;
        border-radius: 50px;

        /* typography */
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 14px;
        letter-spacing: 0.5px;
        cursor: pointer;

        /* transition and shadow */
        box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        transition: all 0.3s ease;
        outline: none;
      }
      /* animation */
      button:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
      }

      #Skipper-logs {
        /* structure */
        margin-top: 30px;
        padding: 20px;
        width: 80%;
        max-width: 600px;
        min-height: 100px;
        background-color: #f8f9fa;
        border: 1px solid;
        border-radius: 8px;

        /* typography */
        font-family: "Courier New", Courier, monospace;
        color: #333;
        text-align: left;

        /* transitions */
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.6s ease;
        pointer-events: none;
      }

      #Skipper-logs.show {
        opacity: 1;
        transform: translateY(0px);
        pointer-events: auto;
      }
    </style>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const call_btn = document.querySelector("#main-body button");
        const log_output = document.getElementById("Skipper-logs");

        call_btn.onclick = () => {
          log_output.classList.add("show");
          log_output.innerText = "Hello!";

          console.log(
            "Call Skipper button has been clicked, log outputs are now being displayed.",
          );
        };
      });
    </script>
  </head>
  <body>
    <div id="sidebar">
      <a href="index.html">
        <img
          id="skipper-small-logo"
          src="assets/logos/skipper_logo_V2.jpg"
          alt="Skipper Small Logo. Goes to Skipper homepage when clicked."
        />
      </a>
    </div>

    <div id="main-body">
      <img
        id="skipper-full-logo"
        src="assets/logos/skipper_full-logo_V2.jpg"
        alt="Skipper Logo"
      />
      <button>Call Skipper!</button>

      <div id="Skipper-logs">Hello from Skipper!</div>
    </div>
  </body>
</html>
